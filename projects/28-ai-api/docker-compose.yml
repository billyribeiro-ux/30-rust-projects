services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiapi
      POSTGRES_PASSWORD: aiapi_dev_password
      POSTGRES_DB: aiapi
    ports:
      - "5449:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiapi -d aiapi"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: {}
