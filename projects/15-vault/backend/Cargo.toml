[package]
name = "vault-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
  "chrono",
  "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth (reused from project 14)
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
subtle = "2.6"
time = "0.3"

# Storage / hashing / sniffing / EXIF strip
object_store = { version = "0.11", features = ["aws"] }
infer = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
proptest = "1"
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 1
