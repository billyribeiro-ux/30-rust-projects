services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_dev_password
      POSTGRES_DB: analytics
    ports:
      - "5448:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: {}
