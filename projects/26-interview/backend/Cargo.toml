[package]
name = "interview-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
sha2 = "0.11"
subtle = "2.6"
time = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "cookies"] }
tokio-tungstenite = "0.29"

[profile.dev]
opt-level = 0
debug = 1
