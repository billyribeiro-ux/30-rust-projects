[package]
name = "finder-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
  "chrono",
  "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth (reused from project 15)
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
time = "0.3"

# OAuth 2.0 — hand-rolled. `url` for URL building, `reqwest` for the
# token exchange. We intentionally do NOT pull `openidconnect` here;
# the lesson is the protocol.
url = "2"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
wiremock = "0.6"

[profile.dev]
opt-level = 0
debug = 1

[lib]
path = "src/lib.rs"

[[bin]]
name = "finder-backend"
path = "src/main.rs"
